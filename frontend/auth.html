<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https: wss: data: blob:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; img-src 'self' data: https: blob:; connect-src 'self' http://localhost:5000 https: wss:;"/>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <title>Ponte Alimentar — Entrar / Cadastrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
</head>
<body>

<div class="page-loading" id="pageLoading"><div class="spinner spinner--lg"></div></div>

<!-- Nav injetada pelo init.js -->

<main class="auth-page">
  <div class="auth-deco">
    <div class="auth-deco__blob auth-deco__blob--1"></div>
    <div class="auth-deco__blob auth-deco__blob--2"></div>
    <div class="auth-deco__tagline">
      <div class="auth-deco__stat" id="decoKg">0</div>
      <div class="auth-deco__text">kg de alimento<br/>redistribuídos</div>
    </div>
    <div class="auth-deco__cards">
      <div class="auth-mini-card">🍽️ 25 marmitas — <strong>agora</strong></div>
      <div class="auth-mini-card">🥦 10kg legumes — <strong>2h atrás</strong></div>
      <div class="auth-mini-card">📦 Arroz e feijão — <strong>ontem</strong></div>
    </div>
  </div>

  <div class="auth-card">
    <!-- Tabs -->
    <div class="auth-tabs" role="tablist">
      <button class="auth-tab" id="tabLogin"    role="tab" aria-selected="true"  aria-controls="panelLogin">Entrar</button>
      <button class="auth-tab" id="tabCadastro" role="tab" aria-selected="false" aria-controls="panelCad">Criar conta</button>
      <div class="auth-tab__bar" id="tabBar"></div>
    </div>

    <!-- ── PAINEL LOGIN ── -->
    <div id="panelLogin" role="tabpanel" aria-labelledby="tabLogin">
      <p class="auth-welcome">Bem-vindo de volta! 👋</p>

      <button class="btn btn--google btn--full" id="btnGoogle">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Continuar com Google
      </button>

      <div class="divider"><span>ou use seu e-mail</span></div>

      <form id="formLogin" novalidate>
        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <div class="input-wrap">
            <input class="input" type="email" id="loginEmail" name="email"
              autocomplete="email" placeholder="seu@email.com" maxlength="254" required/>
            <span class="input-icon">📧</span>
          </div>
          <span class="form-error" id="loginEmailError"></span>
        </div>

        <div class="form-group">
          <label for="loginSenha">Senha</label>
          <div class="input-wrap">
            <input class="input" type="password" id="loginSenha" name="senha"
              autocomplete="current-password" placeholder="Sua senha" maxlength="128" required/>
            <button type="button" class="input-icon" data-toggle-senha="loginSenha" aria-label="Mostrar/ocultar senha">👁</button>
          </div>
          <span class="form-error" id="loginSenhaError"></span>
        </div>

        <div class="auth-forgot">
          <button type="button" id="btnEsqueci">Esqueci minha senha</button>
        </div>

        <button type="submit" class="btn btn--primary btn--full auth-submit" id="btnLoginSubmit">
          Entrar
        </button>
      </form>
    </div>

    <!-- ── PAINEL CADASTRO ── -->
    <div id="panelCad" role="tabpanel" aria-labelledby="tabCadastro" class="hidden">
      <p class="auth-welcome">Junte-se à rede Ponte Alimentar! 🌱</p>

      <button class="btn btn--google btn--full" id="btnGoogleCad">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Cadastrar com Google
      </button>

      <div class="divider"><span>ou preencha abaixo</span></div>

      <form id="formCad" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="cadNome">Nome completo</label>
            <input class="input" type="text" id="cadNome" name="nome"
              autocomplete="name" placeholder="Seu nome" minlength="2" maxlength="100" required/>
            <span class="form-error" id="cadNomeError"></span>
          </div>
          <div class="form-group">
            <label for="cadPapel">Quero ser</label>
            <select class="input" id="cadPapel" name="papel" required>
              <option value="">Selecione...</option>
              <option value="doador">🏪 Doador</option>
              <option value="receptor">🤝 Receptor</option>
              <option value="voluntario">🛵 Voluntário</option>
            </select>
            <span class="form-error" id="cadPapelError"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="cadEmail">E-mail</label>
          <div class="input-wrap">
            <input class="input" type="email" id="cadEmail" name="email"
              autocomplete="email" placeholder="seu@email.com" maxlength="254" required/>
            <span class="input-icon">📧</span>
          </div>
          <span class="form-error" id="cadEmailError"></span>
        </div>

        <div class="form-group">
          <label for="cadSenha">Senha</label>
          <div class="input-wrap">
            <input class="input" type="password" id="cadSenha" name="senha"
              autocomplete="new-password" placeholder="Mín. 8 caracteres com letras e números"
              minlength="8" maxlength="128" required/>
            <button type="button" class="input-icon" data-toggle-senha="cadSenha" aria-label="Mostrar/ocultar senha">👁</button>
          </div>
          <div class="senha-barra"><div class="senha-barra__fill" id="senhaFill"></div></div>
          <span class="form-error" id="cadSenhaError"></span>
        </div>

        <button type="submit" class="btn btn--primary btn--full auth-submit" id="btnCadSubmit">
          Criar conta gratuitamente
        </button>
      </form>
    </div>

    <!-- Loading overlay dentro do card -->
    <div class="auth-loading hidden" id="authLoading">
      <div class="spinner spinner--lg"></div>
      <p>Aguarde...</p>
    </div>

    <!-- Error box -->
    <div class="auth-error hidden" id="authError" role="alert"></div>
  </div>
</main>

<div id="toastContainer"></div>

<script type="module" src="js/init.js"></script>
<script type="module" src="js/utils.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
